<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zo Computer Restart Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #1a1a2e; color: #eee; }
    h1 { color: #00d4ff; }
    #chart-container { width: 100%; max-width: 800px; margin: 20px auto; }
    .status { padding: 10px; background: #16213e; border-radius: 5px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>Zo Computer Restart Dashboard</h1>
  <div class="status" id="status">Loading...</div>
  <div id="chart-container">
    <canvas id="restartChart"></canvas>
  </div>
  <script>
    async function loadRestarts() {
      try {
        const res = await fetch('restarts.json');
        const data = await res.json();
        document.getElementById('status').textContent = `Total restarts: ${data.length}`;
        const labels = data.map(r => new Date(r.timestamp).toLocaleString());
        const ctx = document.getElementById('restartChart').getContext('2d');
        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: 'Restart Events',
              data: data.map(() => 1),
              backgroundColor: '#00d4ff'
            }]
          },
          options: {
            responsive: true,
            scales: { y: { beginAtZero: true } }
          }
        });
      } catch (e) {
        document.getElementById('status').textContent = 'No data yet';
      }
    }
    loadRestarts();
  </script>
</body>
</html>
