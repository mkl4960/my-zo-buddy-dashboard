<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zo-Computer Restart Dashboard</title>
<style>
body { background:#121212; color:#e0e0e0; font-family:Arial, sans-serif; padding:20px; }
.stats { background:#1e1e1e; padding:15px; border-radius:8px; margin:15px 0; }
h1 { color:#bb86fc; }
.last-checked { font-weight:bold; }
.counters { display:flex; justify-content:space-between; margin:15px 0; }
.counter { text-align:center; }
.counter h3 { margin:0; font-size:1.2em; }
.counter p { margin:5px 0 0; font-size:0.9em; }
.chart-container { max-width:800px; margin:30px auto; }
</style>
</head>
<body>
<h1>Zo-Computer Restart Dashboard</h1>
<div class="stats">
  <p><strong>Last Checked:</strong> <span id="lastChecked">Loading...</span></p>
  <div class="counters">
    <div class="counter">
      <h3>Total Restarts</h3>
      <p id="totalRestarts">0</p>
    </div>
    <div class="counter">
      <h3>Today</h3>
      <p id="todayRestarts">0</p>
    </div>
    <div class="counter">
      <h3>This Week</h3>
      <p id="weekRestarts">0</p>
    </div>
    <div class="counter">
      <h3>This Month</h3>
      <p id="monthRestarts">0</p>
    </div>
  </div>
  <h2>Restart Events</h2>
  <ul id="restartsList"></ul>
</div>

<div class="chart-container">
  <canvas id="restartChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
function etFormat(dateStr) {
  const options = { 
    timeZone: 'America/New_York',
    year: 'numeric', 
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    hour12: false
  };
  return new Date(dateStr).toLocaleString('en-US', options);
}

function etDateOnly(dateStr) {
  const options = { 
    timeZone: 'America/New_York',
    year: 'numeric', 
    month: '2-digit',
    day: '2-digit'
  };
  return new Date(dateStr).toLocaleString('en-CA', options);
}

fetch('restarts.json')
  .then(r => r.json())
  .then(data => {
    const lastChecked = data.last_checked || 'Never';
    document.getElementById('lastChecked').textContent = etFormat(lastChecked);

    const restarts = data.restarts || [];
    const totalRestarts = restarts.length;
    document.getElementById('totalRestarts').textContent = totalRestarts;

    // Counters per day, week, month (using Eastern Time)
    const dayCounts = {};
    const weekCounts = {};
    const monthCounts = {};

    const now = new Date();
    const etNow = new Date(now.getTime() + (now.getTimezoneOffset() * 60000));
    const etTodayStr = etDateOnly(now.toISOString());
    const etThisWeek = new Date().toLocaleString('en-CA', { 
      timeZone: 'America/New_York',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      week: 'numeric',
      hour12: false
    });
    const etThisMonth = `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}`;

    restarts.forEach(ts => {
      const etDate = etDateOnly(ts);
      dayCounts[etDate] = (dayCounts[etDate] || 0) + 1;

      const etWeekKey = etThisWeek; // simplified weekly grouping by week start
      weekCounts[etWeekKey] = (weekCounts[etWeekKey] || 0) + 1;

      const monthKey = ts.substring(0, 7); // YYYY-MM
      monthCounts[monthKey] = (monthCounts[monthKey] || 0) + 1;
    });

    // Today counter
    const todayStr = etDateOnly(now.toISOString());
    const todayCount = dayCounts[todayStr] || 0;
    document.getElementById('todayRestarts').textContent = todayCount;

    // This week counter (using current week key)
    const weekCount = weekCounts[etThisWeek] || 0;
    document.getElementById('weekRestarts').textContent = weekCount;

    // This month counter
    const monthCount = monthCounts[etThisMonth] || 0;
    document.getElementById('monthRestarts').textContent = monthCount;

    // Prepare data for chart (daily counts sorted)
    const dates = Object.keys(dayCounts).sort();
    const counts = dates.map(d => dayCounts[d]);

    // Format labels to Eastern Time format (YYYY-MM-DD)
    const etLabels = dates.map(d => etDateOnly(d));

    // Create line chart
    const ctx = document.getElementById('restartChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: etLabels,
        datasets: [{
          label: 'Restarts per Day (ET)',
          data: counts,
          borderColor: '#3498db',
          backgroundColor: 'rgba(52,152,219,0.1)',
          tension: 0.1,
          fill: true,
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: { beginAtZero: true },
          x: { title: { display: true, text: 'Date (ET)' } },
          y: { title: { display: true, text: 'Count' } }
        },
        plugins: {
          legend: { display: true },
          tooltip: { mode: 'index', intersect: false }
        }
      }
    });
  })
  .catch(err => {
    document.getElementById('lastChecked').textContent = 'Error loading data';
    console.error(err);
  });
</script>
</body>
</html>
